<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>效率工作台 - 生活效率工具箱</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style2.css">
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <!-- 装饰图形 -->
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    <div class="decoration decoration-3"></div>

    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🚀</div>
                <span>效率工作台</span>
            </div>
            <nav class="nav-tabs">
                <button class="nav-tab active" data-tool="password">
                    <span class="tab-icon">🔐</span>
                    <span>密码生成</span>
                </button>
                <button class="nav-tab" data-tool="todo">
                    <span class="tab-icon">📄</span>
                    <span>PDF转换</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Toast容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 主容器 -->
    <main class="main-container">
        <!-- 密码生成器面板 -->
        <section class="tool-panel active" id="passwordPanel">
            <div class="card">
                <div class="card-title">🔐 密码生成器</div>
                
                <div class="password-display-wrapper">
                    <div class="password-display" id="passwordDisplay">点击生成密码</div>
                    <div class="strength-indicator">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="loading-overlay" id="passwordLoading">
                        <div class="spinner"></div>
                    </div>
                </div>
                
                <button class="copy-btn" id="copyBtn">
                    📋 复制密码
                </button>

                <div class="setting-item" style="margin-top: 25px;">
                    <div class="setting-label">
                        <span>密码长度</span>
                        <span class="length-value" id="lengthValue">16</span>
                    </div>
                    <input type="range" id="lengthSlider" min="8" max="32" value="16">
                </div>

                <div class="setting-item">
                    <div class="setting-label">字符类型</div>
                    <div class="checkbox-grid">
                        <div class="checkbox-item">
                            <input type="checkbox" id="uppercase" checked>
                            <label for="uppercase">大写字母 (A-Z)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="lowercase" checked>
                            <label for="lowercase">小写字母 (a-z)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="numbers" checked>
                            <label for="numbers">数字 (0-9)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="symbols" checked>
                            <label for="symbols">特殊符号 (!@#$)</label>
                        </div>
                    </div>
                </div>

                <button class="generate-btn" id="generateBtn">
                    ✨ 生成密码
                </button>

                <div class="shortcut-hint">
                    快捷键: <kbd>Ctrl</kbd>+<kbd>N</kbd> 生成新密码 | <kbd>Ctrl</kbd>+<kbd>C</kbd> 复制
                </div>
            </div>
        </section>

        <!-- PDF 转换工具面板 -->
        <section class="tool-panel" id="todoPanel">
            <div class="card">
                <div class="card-title">📄 PDF 转换工具</div>
                
                <!-- 转换模式选择 -->
                <div class="conversion-modes">
                    <button class="mode-btn active" data-mode="image-to-pdf">
                        <span class="mode-icon">🖼️</span>
                        <span>图片转 PDF</span>
                    </button>
                    <button class="mode-btn" data-mode="html-to-pdf">
                        <span class="mode-icon">🌐</span>
                        <span>HTML 转 PDF</span>
                    </button>
                    <button class="mode-btn" data-mode="merge-pdf">
                        <span class="mode-icon">📑</span>
                        <span>合并 PDF</span>
                    </button>
                </div>

                <!-- 图片转 PDF 模式 -->
                <div class="mode-panel active" id="imageToPdfPanel">
                    <div class="upload-area" id="imageUploadArea">
                        <div class="upload-icon">📷</div>
                        <div class="upload-text">点击或拖拽图片到此处</div>
                        <div class="upload-hint">支持 JPG、PNG、GIF 格式</div>
                        <input type="file" id="imageFileInput" accept="image/*" multiple hidden>
                    </div>
                    
                    <div class="uploaded-files" id="imageFilesList"></div>

                    <div class="options-section">
                        <label class="option-item">
                            <input type="checkbox" id="imageLandscape" checked>
                            <span>横向布局</span>
                        </label>
                        <label class="option-item">
                            <input type="checkbox" id="imageCompress">
                            <span>压缩图片</span>
                        </label>
                    </div>
                </div>

                <!-- HTML 转 PDF 模式 -->
                <div class="mode-panel" id="htmlToPdfPanel">
                    <div class="url-input-section">
                        <input type="url" class="url-input" id="htmlUrlInput" placeholder="输入网页 URL...">
                    </div>
                    
                    <textarea class="html-textarea" id="htmlContentInput" placeholder="或直接输入 HTML 内容..."></textarea>

                    <div class="options-section">
                        <label class="option-item">
                            <input type="checkbox" id="htmlIncludeBackground" checked>
                            <span>包含背景</span>
                        </label>
                        <label class="option-item">
                            <input type="checkbox" id="htmlPrintMedia">
                            <span>使用打印样式</span>
                        </label>
                    </div>
                </div>

                <!-- 合并 PDF 模式 -->
                <div class="mode-panel" id="mergePdfPanel">
                    <div class="upload-area" id="pdfUploadArea">
                        <div class="upload-icon">📄</div>
                        <div class="upload-text">点击或拖拽 PDF 文件到此处</div>
                        <div class="upload-hint">支持多个 PDF 文件</div>
                        <input type="file" id="pdfFileInput" accept=".pdf" multiple hidden>
                    </div>
                    
                    <div class="uploaded-files" id="pdfFilesList"></div>
                </div>

                <!-- 转换按钮 -->
                <button class="convert-btn" id="convertBtn">
                    ⚡ 开始转换
                </button>

                <!-- 进度条 -->
                <div class="progress-container" id="progressContainer" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">正在处理...</div>
                </div>

                <!-- 下载区域 -->
                <div class="download-section" id="downloadSection" style="display: none;">
                    <button class="download-btn" id="downloadBtn">
                        📥 下载 PDF
                    </button>
                    <div class="file-info" id="fileInfo"></div>
                </div>

                <div class="shortcut-hint">
                    快捷键: <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 开始转换
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
    <script src="app2.js"></script>
</body>
</html>
