<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>效率工作台 - 生活效率工具箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-color: #165DFF;
            --success-color: #00b42a;
            --warning-color: #ff7d00;
            --danger-color: #f53f3f;
            --bg-light: #F2F3F5;
            --text-primary: #1D2129;
            --text-secondary: #4E5969;
            --border-color: #E5E6EB;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--primary-gradient);
            min-height: 100vh;
            padding: 20px;
            padding-top: 100px;
        }

        /* 顶部导航 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            padding: 0 20px;
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--primary-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
        }

        .nav-tab {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .nav-tab:hover {
            background: var(--bg-light);
            color: var(--text-primary);
        }

        .nav-tab.active {
            background: var(--primary-gradient);
            color: white;
        }

        .nav-tab .tab-icon {
            font-size: 18px;
        }

        /* 主容器 */
        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* 工具面板通用样式 */
        .tool-panel {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tool-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 卡片通用样式 */
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 22px;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ==================== 密码生成器样式 ==================== */
        .password-display-wrapper {
            background: var(--bg-light);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .password-display {
            font-size: 24px;
            font-family: 'Courier New', monospace;
            color: var(--primary-color);
            word-break: break-all;
            min-height: 36px;
            transition: all 0.3s ease;
        }

        .password-display.changing {
            animation: pulse 0.3s ease;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .copy-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .copy-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .copy-btn:active::after {
            width: 300px;
            height: 300px;
        }

        .copy-btn:hover {
            background: #0e42d2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(22, 93, 255, 0.4);
        }

        .copy-btn.copied {
            background: var(--success-color);
        }

        .setting-item {
            margin-bottom: 20px;
        }

        .setting-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: var(--text-secondary);
            font-size: 15px;
        }

        .length-value {
            font-weight: 600;
            color: var(--primary-color);
            font-size: 18px;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: var(--border-color);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 0 8px rgba(22, 93, 255, 0.1);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: var(--bg-light);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkbox-item:hover {
            background: #e8e9ed;
        }

        .checkbox-item input {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .checkbox-item label {
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            user-select: none;
        }

        .generate-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .generate-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .generate-btn:active::after {
            width: 400px;
            height: 400px;
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .generate-btn:active {
            transform: translateY(-1px);
        }

        /* 密码强度指示器 */
        .strength-indicator {
            height: 6px;
            border-radius: 3px;
            margin-top: 15px;
            background: var(--border-color);
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            border-radius: 3px;
            transition: all 0.4s ease;
        }

        .strength-bar.weak { width: 33%; background: var(--danger-color); }
        .strength-bar.medium { width: 66%; background: var(--warning-color); }
        .strength-bar.strong { width: 100%; background: var(--success-color); }

        /* ==================== 待办清单样式 ==================== */
        .todo-input-section {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .todo-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .todo-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(22, 93, 255, 0.1);
        }

        .add-btn {
            padding: 14px 24px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        .todo-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            background: white;
            color: var(--text-secondary);
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .filter-btn.active {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
        }

        .todo-stats {
            display: flex;
            gap: 20px;
            padding: 15px;
            background: var(--bg-light);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
            flex: 1;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            transition: all 0.3s ease;
        }

        .stat-value.updating {
            animation: bounce 0.4s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .todo-list {
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 16px;
            background: var(--bg-light);
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item.completed {
            opacity: 0.6;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .todo-item.removing {
            animation: slideOut 0.3s ease forwards;
        }

        @keyframes slideOut {
            to {
                opacity: 0;
                transform: translateX(20px);
            }
        }

        .todo-checkbox {
            width: 24px;
            height: 24px;
            margin-right: 14px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .todo-text {
            flex: 1;
            font-size: 15px;
            color: var(--text-primary);
            word-break: break-word;
        }

        .todo-date {
            font-size: 12px;
            color: var(--text-secondary);
            margin-right: 12px;
        }

        .todo-delete {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .todo-delete:hover {
            background: rgba(245, 63, 63, 0.1);
            color: var(--danger-color);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-text {
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* 导出按钮 */
        .export-section {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .export-btn {
            flex: 1;
            min-width: 140px;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            background: white;
            color: var(--text-primary);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .export-btn:hover {
            border-color: var(--primary-color);
            background: rgba(22, 93, 255, 0.05);
        }

        /* ==================== Toast 通知 ==================== */
        .toast-container {
            position: fixed;
            top: 90px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 14px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: toastIn 0.4s ease;
            max-width: 320px;
        }

        .toast.hiding {
            animation: toastOut 0.3s ease forwards;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }

        .toast-icon {
            font-size: 20px;
        }

        .toast-message {
            font-size: 14px;
            color: var(--text-primary);
        }

        .toast.success .toast-icon { color: var(--success-color); }
        .toast.error .toast-icon { color: var(--danger-color); }
        .toast.info .toast-icon { color: var(--primary-color); }

        /* ==================== 加载状态 ==================== */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            z-index: 10;
        }

        .loading-overlay.active {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==================== 快捷键提示 ==================== */
        .shortcut-hint {
            text-align: center;
            padding: 12px;
            background: var(--bg-light);
            border-radius: 10px;
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .shortcut-hint kbd {
            padding: 3px 8px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            margin: 0 3px;
        }

        /* ==================== 装饰图形 ==================== */
        .decoration {
            position: fixed;
            pointer-events: none;
            z-index: -1;
        }

        .decoration-1 {
            top: 10%;
            left: 5%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .decoration-2 {
            top: 60%;
            right: 5%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(118, 75, 162, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 8s ease-in-out infinite reverse;
        }

        .decoration-3 {
            bottom: 10%;
            left: 10%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(22, 93, 255, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 5s ease-in-out infinite 1s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(10deg); }
        }

        /* ==================== 图表区域 ==================== */
        .chart-section {
            margin-top: 20px;
            padding: 20px;
            background: var(--bg-light);
            border-radius: 12px;
        }

        .chart-title {
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .pie-chart {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(
                var(--success-color) 0deg,
                var(--success-color) var(--complete-angle, 0deg),
                var(--border-color) var(--complete-angle, 0deg),
                var(--border-color) 360deg
            );
            margin: 0 auto;
            position: relative;
            transition: all 0.5s ease;
        }

        .pie-chart::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: var(--bg-light);
            border-radius: 50%;
        }

        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            font-size: 14px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        /* ==================== 移动端适配 ==================== */
        @media (max-width: 768px) {
            body {
                padding: 15px;
                padding-top: 80px;
            }

            .header-content {
                flex-direction: column;
                height: auto;
                padding: 15px 0;
                gap: 15px;
            }

            .nav-tabs {
                width: 100%;
                overflow-x: auto;
                padding-bottom: 5px;
            }

            .nav-tab {
                padding: 8px 14px;
                font-size: 14px;
            }

            .nav-tab .tab-icon {
                font-size: 16px;
            }

            .card {
                padding: 20px;
                border-radius: 16px;
            }

            .checkbox-grid {
                grid-template-columns: 1fr;
            }

            .todo-input-section {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            .todo-stats {
                flex-wrap: wrap;
            }

            .stat-item {
                min-width: 80px;
            }

            .export-section {
                flex-direction: column;
            }

            .export-btn {
                min-width: unset;
            }

            .decoration {
                display: none;
            }

            .toast-container {
                left: 20px;
                right: 20px;
            }

            .toast {
                max-width: unset;
            }

            .password-display {
                font-size: 18px;
            }

            .shortcut-hint {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .logo span {
                display: none;
            }

            .nav-tab span {
                display: none;
            }

            .nav-tab {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <!-- 装饰图形 -->
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    <div class="decoration decoration-3"></div>

    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">🚀</div>
                <span>效率工作台</span>
            </div>
            <nav class="nav-tabs">
                <button class="nav-tab active" data-tool="password">
                    <span class="tab-icon">🔐</span>
                    <span>密码生成</span>
                </button>
                <button class="nav-tab" data-tool="todo">
                    <span class="tab-icon">✅</span>
                    <span>待办清单</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Toast容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 主容器 -->
    <main class="main-container">
        <!-- 密码生成器面板 -->
        <section class="tool-panel active" id="passwordPanel">
            <div class="card">
                <div class="card-title">🔐 密码生成器</div>
                
                <div class="password-display-wrapper">
                    <div class="password-display" id="passwordDisplay">点击生成密码</div>
                    <div class="strength-indicator">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="loading-overlay" id="passwordLoading">
                        <div class="spinner"></div>
                    </div>
                </div>
                
                <button class="copy-btn" id="copyBtn">
                    📋 复制密码
                </button>

                <div class="setting-item" style="margin-top: 25px;">
                    <div class="setting-label">
                        <span>密码长度</span>
                        <span class="length-value" id="lengthValue">16</span>
                    </div>
                    <input type="range" id="lengthSlider" min="8" max="32" value="16">
                </div>

                <div class="setting-item">
                    <div class="setting-label">字符类型</div>
                    <div class="checkbox-grid">
                        <div class="checkbox-item">
                            <input type="checkbox" id="uppercase" checked>
                            <label for="uppercase">大写字母 (A-Z)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="lowercase" checked>
                            <label for="lowercase">小写字母 (a-z)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="numbers" checked>
                            <label for="numbers">数字 (0-9)</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="symbols" checked>
                            <label for="symbols">特殊符号 (!@#$)</label>
                        </div>
                    </div>
                </div>

                <button class="generate-btn" id="generateBtn">
                    ✨ 生成密码
                </button>

                <div class="shortcut-hint">
                    快捷键: <kbd>Ctrl</kbd>+<kbd>N</kbd> 生成新密码 | <kbd>Ctrl</kbd>+<kbd>C</kbd> 复制
                </div>
            </div>
        </section>

        <!-- 待办清单面板 -->
        <section class="tool-panel" id="todoPanel">
            <div class="card">
                <div class="card-title">✅ 待办清单</div>
                
                <div class="todo-input-section">
                    <input type="text" class="todo-input" id="todoInput" placeholder="输入新任务，按回车添加...">
                    <button class="add-btn" id="addTodoBtn">➕ 添加</button>
                </div>

                <div class="todo-filters">
                    <button class="filter-btn active" data-filter="all">全部</button>
                    <button class="filter-btn" data-filter="active">待完成</button>
                    <button class="filter-btn" data-filter="completed">已完成</button>
                </div>

                <div class="todo-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="totalCount">0</div>
                        <div class="stat-label">总任务</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="completedCount">0</div>
                        <div class="stat-label">已完成</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="pendingCount">0</div>
                        <div class="stat-label">待完成</div>
                    </div>
                </div>

                <ul class="todo-list" id="todoList"></ul>

                <div class="empty-state" id="emptyState" style="display: none;">
                    <div class="empty-icon">📝</div>
                    <div class="empty-text">暂无任务，添加一个吧！</div>
                </div>

                <!-- 图表 -->
                <div class="chart-section" id="chartSection" style="display: none;">
                    <div class="chart-title">📊 完成进度</div>
                    <div class="pie-chart" id="pieChart"></div>
                    <div class="chart-legend">
                        <div class="legend-item">
                            <div class="legend-dot" style="background: var(--success-color);"></div>
                            <span>已完成</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-dot" style="background: var(--border-color);"></div>
                            <span>待完成</span>
                        </div>
                    </div>
                </div>

                <div class="export-section">
                    <button class="export-btn" id="exportJson">
                        📥 导出 JSON
                    </button>
                    <button class="export-btn" id="exportCsv">
                        📥 导出 CSV
                    </button>
                </div>

                <div class="shortcut-hint">
                    快捷键: <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 添加任务 | <kbd>Delete</kbd> 删除选中
                </div>
            </div>
        </section>
    </main>

    <script>
        // ==================== 工具封装 ====================
        
        /**
         * Toast通知系统 - 统一的操作反馈提示
         */
        const Toast = {
            show(message, type = 'info', duration = 3000) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                
                const icons = {
                    success: '✅',
                    error: '❌',
                    info: '💡'
                };
                
                toast.innerHTML = `
                    <span class="toast-icon">${icons[type]}</span>
                    <span class="toast-message">${message}</span>
                `;
                
                container.appendChild(toast);
                
                // 自动移除
                setTimeout(() => {
                    toast.classList.add('hiding');
                    setTimeout(() => toast.remove(), 300);
                }, duration);
            }
        };

        /**
         * 密码生成器模块
         */
        const PasswordGenerator = {
            charset: {
                uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                lowercase: 'abcdefghijklmnopqrstuvwxyz',
                numbers: '0123456789',
                symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
            },
            
            elements: {},
            
            init() {
                // 缓存DOM元素
                this.elements = {
                    display: document.getElementById('passwordDisplay'),
                    copyBtn: document.getElementById('copyBtn'),
                    generateBtn: document.getElementById('generateBtn'),
                    lengthSlider: document.getElementById('lengthSlider'),
                    lengthValue: document.getElementById('lengthValue'),
                    strengthBar: document.getElementById('strengthBar'),
                    loading: document.getElementById('passwordLoading'),
                    uppercase: document.getElementById('uppercase'),
                    lowercase: document.getElementById('lowercase'),
                    numbers: document.getElementById('numbers'),
                    symbols: document.getElementById('symbols')
                };
                
                this.bindEvents();
                this.generate();
            },
            
            bindEvents() {
                this.elements.lengthSlider.addEventListener('input', () => {
                    this.elements.lengthValue.textContent = this.elements.lengthSlider.value;
                });
                
                this.elements.generateBtn.addEventListener('click', () => this.generate());
                this.elements.copyBtn.addEventListener('click', () => this.copy());
                
                // 字符类型变化时重新生成
                [this.elements.uppercase, this.elements.lowercase, 
                 this.elements.numbers, this.elements.symbols].forEach(checkbox => {
                    checkbox.addEventListener('change', () => this.generate());
                });
            },
            
            generate() {
                let validChars = '';
                
                if (this.elements.uppercase.checked) validChars += this.charset.uppercase;
                if (this.elements.lowercase.checked) validChars += this.charset.lowercase;
                if (this.elements.numbers.checked) validChars += this.charset.numbers;
                if (this.elements.symbols.checked) validChars += this.charset.symbols;
                
                if (validChars === '') {
                    this.elements.display.textContent = '请至少选择一种字符类型';
                    this.elements.strengthBar.className = 'strength-bar';
                    return;
                }
                
                // 显示加载状态
                this.elements.loading.classList.add('active');
                this.elements.display.classList.add('changing');
                
                setTimeout(() => {
                    let password = '';
                    const length = parseInt(this.elements.lengthSlider.value);
                    
                    for (let i = 0; i < length; i++) {
                        const randomIndex = Math.floor(Math.random() * validChars.length);
                        password += validChars[randomIndex];
                    }
                    
                    this.elements.display.textContent = password;
                    this.updateStrength(password);
                    
                    this.elements.loading.classList.remove('active');
                    this.elements.display.classList.remove('changing');
                    this.elements.copyBtn.textContent = '📋 复制密码';
                    this.elements.copyBtn.classList.remove('copied');
                }, 300);
            },
            
            updateStrength(password) {
                const length = password.length;
                let strength = 0;
                
                // 简单的强度计算
                if (length >= 12) strength++;
                if (length >= 16) strength++;
                if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength++;
                if (/[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password)) strength++;
                
                const bar = this.elements.strengthBar;
                bar.className = 'strength-bar';
                
                if (strength <= 2) {
                    bar.classList.add('weak');
                } else if (strength <= 3) {
                    bar.classList.add('medium');
                } else {
                    bar.classList.add('strong');
                }
            },
            
            async copy() {
                const password = this.elements.display.textContent;
                
                if (!password || password === '点击生成密码' || 
                    password === '请至少选择一种字符类型') {
                    Toast.show('没有可复制的密码', 'error');
                    return;
                }
                
                try {
                    await navigator.clipboard.writeText(password);
                    this.elements.copyBtn.textContent = '✅ 已复制';
                    this.elements.copyBtn.classList.add('copied');
                    Toast.show('密码已复制到剪贴板', 'success');
                    
                    setTimeout(() => {
                        this.elements.copyBtn.textContent = '📋 复制密码';
                        this.elements.copyBtn.classList.remove('copied');
                    }, 2000);
                } catch (err) {
                    Toast.show('复制失败，请手动复制', 'error');
                }
            }
        };

        /**
         * 待办清单模块
         */
        const TodoList = {
            data: [],
            filter: 'all',
            elements: {},
            
            init() {
                this.elements = {
                    input: document.getElementById('todoInput'),
                    addBtn: document.getElementById('addTodoBtn'),
                    list: document.getElementById('todoList'),
                    emptyState: document.getElementById('emptyState'),
                    chartSection: document.getElementById('chartSection'),
                    pieChart: document.getElementById('pieChart'),
                    totalCount: document.getElementById('totalCount'),
                    completedCount: document.getElementById('completedCount'),
                    pendingCount: document.getElementById('pendingCount'),
                    exportJson: document.getElementById('exportJson'),
                    exportCsv: document.getElementById('exportCsv'),
                    filters: document.querySelectorAll('.filter-btn')
                };
                
                this.loadFromStorage();
                this.bindEvents();
                this.render();
            },
            
            bindEvents() {
                // 添加任务
                this.elements.addBtn.addEventListener('click', () => this.addTodo());
                this.elements.input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTodo();
                });
                
                // 筛选
                this.elements.filters.forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.filter = btn.dataset.filter;
                        this.elements.filters.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.render();
                    });
                });
                
                // 导出
                this.elements.exportJson.addEventListener('click', () => this.exportAs('json'));
                this.elements.exportCsv.addEventListener('click', () => this.exportAs('csv'));
            },
            
            loadFromStorage() {
                const stored = localStorage.getItem('efficiencyTools_todos');
                if (stored) {
                    this.data = JSON.parse(stored);
                }
            },
            
            saveToStorage() {
                localStorage.setItem('efficiencyTools_todos', JSON.stringify(this.data));
            },
            
            addTodo() {
                const text = this.elements.input.value.trim();
                
                if (!text) {
                    Toast.show('请输入任务内容', 'error');
                    return;
                }
                
                const todo = {
                    id: Date.now(),
                    text: text,
                    completed: false,
                    createdAt: new Date().toLocaleDateString('zh-CN')
                };
                
                this.data.unshift(todo);
                this.saveToStorage();
                this.elements.input.value = '';
                this.render();
                Toast.show('任务添加成功', 'success');
            },
            
            toggleTodo(id) {
                const todo = this.data.find(t => t.id === id);
                if (todo) {
                    todo.completed = !todo.completed;
                    this.saveToStorage();
                    this.render();
                }
            },
            
            deleteTodo(id, element) {
                element.classList.add('removing');
                
                setTimeout(() => {
                    this.data = this.data.filter(t => t.id !== id);
                    this.saveToStorage();
                    this.render();
                    Toast.show('任务已删除', 'info');
                }, 300);
            },
            
            getFilteredData() {
                switch (this.filter) {
                    case 'active':
                        return this.data.filter(t => !t.completed);
                    case 'completed':
                        return this.data.filter(t => t.completed);
                    default:
                        return this.data;
                }
            },
            
            updateStats() {
                const total = this.data.length;
                const completed = this.data.filter(t => t.completed).length;
                const pending = total - completed;
                
                // 数字动画
                ['totalCount', 'completedCount', 'pendingCount'].forEach(id => {
                    const el = this.elements[id.replace('Count', 'Count').replace('total', 'total').replace('completed', 'completed').replace('pending', 'pending')] || 
                               document.getElementById(id);
                    if (el) {
                        el.classList.add('updating');
                        setTimeout(() => el.classList.remove('updating'), 400);
                    }
                });
                
                this.elements.totalCount.textContent = total;
                this.elements.completedCount.textContent = completed;
                this.elements.pendingCount.textContent = pending;
                
                // 更新饼图
                if (total > 0) {
                    this.elements.chartSection.style.display = 'block';
                    const angle = (completed / total) * 360;
                    this.elements.pieChart.style.setProperty('--complete-angle', `${angle}deg`);
                } else {
                    this.elements.chartSection.style.display = 'none';
                }
            },
            
            render() {
                const filtered = this.getFilteredData();
                
                if (this.data.length === 0) {
                    this.elements.list.style.display = 'none';
                    this.elements.emptyState.style.display = 'block';
                    this.elements.chartSection.style.display = 'none';
                } else {
                    this.elements.list.style.display = 'block';
                    this.elements.emptyState.style.display = 'none';
                    
                    this.elements.list.innerHTML = filtered.map(todo => `
                        <li class="todo-item ${todo.completed ? 'completed' : ''}" data-id="${todo.id}">
                            <input type="checkbox" class="todo-checkbox" 
                                   ${todo.completed ? 'checked' : ''} 
                                   onchange="TodoList.toggleTodo(${todo.id})">
                            <span class="todo-text">${this.escapeHtml(todo.text)}</span>
                            <span class="todo-date">${todo.createdAt}</span>
                            <button class="todo-delete" onclick="TodoList.deleteTodo(${todo.id}, this.parentElement)">🗑️</button>
                        </li>
                    `).join('');
                }
                
                this.updateStats();
            },
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },
            
            exportAs(format) {
                if (this.data.length === 0) {
                    Toast.show('没有可导出的数据', 'error');
                    return;
                }
                
                let content, filename, mimeType;
                
                if (format === 'json') {
                    content = JSON.stringify(this.data, null, 2);
                    filename = `待办清单_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.json`;
                    mimeType = 'application/json';
                } else {
                    // CSV格式
                    const headers = 'ID,任务内容,完成状态,创建日期';
                    const rows = this.data.map(t => 
                        `${t.id},"${t.text}",${t.completed ? '已完成' : '未完成'},${t.createdAt}`
                    );
                    content = [headers, ...rows].join('\n');
                    filename = `待办清单_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.csv`;
                    mimeType = 'text/csv;charset=utf-8';
                }
                
                // 下载文件
                const blob = new Blob(['\ufeff' + content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
                
                Toast.show(`已导出为${format.toUpperCase()}文件`, 'success');
            }
        };

        /**
         * 导航控制
         */
        const Navigation = {
            init() {
                const tabs = document.querySelectorAll('.nav-tab');
                const panels = document.querySelectorAll('.tool-panel');
                
                tabs.forEach(tab => {
                    tab.addEventListener('click', () => {
                        const tool = tab.dataset.tool;
                        
                        // 切换标签
                        tabs.forEach(t => t.classList.remove('active'));
                        tab.classList.add('active');
                        
                        // 切换面板
                        panels.forEach(panel => {
                            if (panel.id === `${tool}Panel`) {
                                panel.classList.add('active');
                            } else {
                                panel.classList.remove('active');
                            }
                        });
                        
                        // 如果切换到密码生成器，自动生成新密码
                        if (tool === 'password') {
                            PasswordGenerator.generate();
                        }
                    });
                });
            }
        };

        /**
         * 快捷键支持
         */
        const Shortcuts = {
            init() {
                document.addEventListener('keydown', (e) => {
                    // Ctrl+N: 生成新密码
                    if (e.ctrlKey && e.key === 'n') {
                        e.preventDefault();
                        document.querySelector('[data-tool="password"]').click();
                        PasswordGenerator.generate();
                    }
                    
                    // Ctrl+Enter: 添加待办
                    if (e.ctrlKey && e.key === 'Enter') {
                        const activePanel = document.querySelector('.tool-panel.active');
                        if (activePanel && activePanel.id === 'todoPanel') {
                            e.preventDefault();
                            TodoList.addTodo();
                        }
                    }
                });
            }
        };

        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            Navigation.init();
            PasswordGenerator.init();
            TodoList.init();
            Shortcuts.init();
        });
    </script>
</body>
</html>
